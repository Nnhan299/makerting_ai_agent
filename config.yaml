# === Cấu hình ứng dụng Marketing AI Campaign Manager ===

app_name: "Marketing AI Campaign Manager"
version: "1.0.0"

# === Cấu hình LLM (Google Gemini) ===
llm:
  model: "gemini-1.5-pro"
  temperature: 0.7
  max_retries: 3
  retry_delay_seconds: 2

# === Cấu hình Pipeline AI ===
pipeline:
  max_posts_per_campaign: 30
  default_stages:
    - "Teaser"
    - "Launch"
    - "CTA"
  supported_channels:
    - "Facebook"
    - "LinkedIn"
    - "Email"

# === Cấu hình Xuất file ===
export:
  excel_template: true
  include_audit_report: true
